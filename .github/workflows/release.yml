name: Release

on:
  workflow_dispatch:
  push:
    branches: [main, prerelease]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: deploy
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{secrets.GH_USER_TOKEN}}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Release
        env:
          GH_TOKEN: ${{secrets.GH_USER_TOKEN}}
        run: |
          touch /tmp/dist-tag # create a blank file, so it's always there even if we don't do a release
          npm install
          npm run release

      - name: Set dist tag
        id: dist-tag
        run: |
          {
            echo 'DIST_TAG<<EOF'
            cat /tmp/dist-tag
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Generate .npmignore
        run: cp .gitignore .npmignore && echo '!.gitignore' >> .npmignore && cat .npmignore

      - name: NPM pack dry-run
        run: npm pack -dry

      - name: Publish
        if: steps.dist-tag.outputs.DIST_TAG != ''
        run: npm publish --tag "${{ steps.dist-tag.outputs.DIST_TAG }}"
