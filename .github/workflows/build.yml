name: Build

on:
  pull_request:
    branches: [main, master, develop, alpha, prerelease]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The `build` job below covers React end to end (gradle build, lint, unit + e2e) for
  # the defaults app. This job keeps every framework's generator honest: for each one it
  # generates the defaults app, the full-routes fixture app and an FDC3-channels app, plus
  # for React an app with the AI chat on, and runs the ox lint gates over each.
  #
  # BUILD=1 adds `tsc --noEmit` and the production build per app, which is what makes a
  # broken generated tile fail here. Lint alone does not type-check, and the app the
  # `build` job below compiles is the defaults one, which generates no tiles at all, so
  # before this nothing compiled a generated tile: a grid tile passed a prop the React
  # wrapper's types did not declare and CI stayed green while `npm run build` failed for
  # anyone scaffolding with routes. For the AI app it also checks that the assistant and
  # its bubble are built into a chunk of their own, and into no other.
  generated-apps:
    strategy:
      fail-fast: false
      matrix:
        framework: [react, webcomponents, angular]
    runs-on: ubuntu-latest
    env:
      BUILD: 1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and lint ${{ matrix.framework }} apps (default + full + fdc3, and ai for React)
        run: ./.genx/scripts/generate-test-apps.sh ${{ matrix.framework }}

      # Generates its own React and web-components apps, so one leg is enough. This job has no Java
      # or artifactory credentials, so it runs the emission checks only; the build job adds GRADLE=1.
      - name: Check what the AI chat path emits
        if: matrix.framework == 'react'
        run: ./.genx/scripts/check-ai-emission.sh

  build:
    env:
      genesisArtifactoryUser: ${{ secrets.JFROG_LIBS_RELEASE_CLIENT_RO_USER }}
      genesisArtifactoryPassword: ${{ secrets.JFROG_LIBS_RELEASE_CLIENT_RO_KEY }}
      USE_DOCKER: 1
      GRADLE_PARAMS: ${{ github.base_ref == 'prerelease' && '-PuseDevRepo=true' || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: KengoTODA/actions-setup-docker-compose@main
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Configure Gradle
        run: ./.genx/scripts/init-gradle.sh

      - name: Generate sample app
        working-directory: /tmp
        run: npx -y @genesislcap/genx@latest init testapp -s "${{github.workspace}}" -x --framework react --enableDeployPlugin

      - name: Copy fixtures
        run: cp -R ./.genx/tests/fixtures/testapp/* /tmp/testapp

      - name: Build sample app
        working-directory: /tmp/testapp
        run: ./gradlew ${GRADLE_PARAMS} build --info

      # The AI chat proxy is a script, and scripts compile only when the router starts, so no build
      # compiles it. This one builds an AI app, runs the security scan on it and compiles both
      # vendors' proxies against this Genesis version. It picks up GRADLE_PARAMS from the job.
      - name: Build, scan and compile the AI chat proxy
        env:
          GRADLE: 1
        run: ./.genx/scripts/check-ai-emission.sh

      - name: Lint UI
        working-directory: /tmp/testapp/client
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Test (unit & integration UI)
        working-directory: /tmp/testapp/client
        run: npm run test && npm run test:e2e

      - name: Skip binding to privileged port on CI
        working-directory: /tmp/testapp
        run: sed -i "s/- '443:443'/# - '443:443'/g" docker-compose.yml

      - name: Create Server Dockerfile
        working-directory: /tmp/testapp
        run: ./gradlew ${GRADLE_PARAMS} :server:testapp-app:createDockerfile --info

      - name: Build Docker images
        working-directory: /tmp/testapp
        run: docker-compose build

      # - name: Run healthcheck
      #   run: ./.genx/scripts/health-check.sh http://localhost:4569/health/status

      # - name: Stop the app
      #   working-directory: /tmp/testapp
      #   run: docker-compose down
